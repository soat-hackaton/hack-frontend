<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Hack Video</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:9999; display:none; justify-content:center; align-items:center; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">Hack Video Processor</span>
            <button id="btnLogout" class="btn btn-outline-light btn-sm">Sair</button>
        </div>
    </nav>

    <div class="container">
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-success text-white">Novo Processamento</div>
            <div class="card-body">
                <label class="form-label">Selecione um vídeo para processar</label>
                <div class="input-group">
                    <input type="file" class="form-control" id="videoInput" accept="video/*">
                    <button class="btn btn-success" type="button" id="btnUpload">Enviar</button>
                </div>
                <div id="uploadMsg" class="mt-2"></div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Seus Vídeos</span>
                <button id="btnRefresh" class="btn btn-sm btn-secondary">Atualizar</button>
            </div>
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead>
                        <tr>
                            <th>Nome do Arquivo</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="videoTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="loader" class="loading-overlay">
        <div class="spinner-border text-primary" role="status"></div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/video.js"></script>
</body>
</html>
