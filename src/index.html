<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Hack Video</title>

    <link rel="icon" type="image/png" href="img/favicon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link href="css/styles.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div id="loader" class="loader-overlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Carregando...</span>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-camera-reels"></i> Hack Video
            </a>
            <div class="d-flex">
                <button class="btn btn-outline-light btn-sm" id="btnLogout">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <h4 id="userGreeting" class="mb-4 fw-normal">Olá, que vídeo iremos processar hoje?</h4>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-success text-white">
                <i class="bi bi-cloud-upload"></i> Novo Processamento
            </div>
            <div class="card-body">
                <label for="videoInput" class="form-label fw-bold">Selecione um vídeo para processar</label>

                <div class="input-group mb-1">
                    <input type="file" class="form-control" id="videoInput" accept="video/mp4">
                    <button class="btn btn-success" type="button" id="btnUpload" disabled>Enviar</button>
                </div>

                <small class="text-muted">Formato suportado: .mp4 (Máx 100MB)</small>

                <div id="uploadMsg" class="mt-2"></div>

                <div id="uploadProgress" class="mt-3 d-none">
                    <div class="d-flex align-items-center mb-2">
                        <div class="spinner-border spinner-border-sm text-success me-2" role="status"></div>
                        <strong id="uploadStepText">Iniciando...</strong>
                    </div>
                    <div class="progress" style="height: 10px;">
                        <div id="uploadProgressBar"
                            class="progress-bar bg-success progress-bar-striped progress-bar-animated"
                            role="progressbar" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card p-4 shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Seus Vídeos</h5>
                <button class="btn btn-outline-secondary btn-sm" id="btnRefresh">
                    <i class="bi bi-arrow-clockwise"></i> Atualizar Lista
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th style="width: 35%">Nome do Arquivo</th>
                            <th style="width: 15%">Status</th>
                            <th style="width: 25%">Data de Criação</th>
                            <th style="width: 25%">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="videoTableBody">
                    </tbody>
                </table>
            </div>

            <div id="paginationControls" class="d-flex justify-content-between align-items-center mt-3 d-none">
                <button class="btn btn-sm btn-outline-secondary" id="btnPrevPage" disabled>
                    <i class="bi bi-chevron-left"></i> Anterior
                </button>
                <span class="text-muted small" id="pageIndicator">Página 1</span>
                <button class="btn btn-sm btn-outline-secondary" id="btnNextPage" disabled>
                    Próximo <i class="bi bi-chevron-right"></i>
                </button>
            </div>

        </div>

    </div>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/video.js"></script>
</body>

</html>
