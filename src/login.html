<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Hack Video</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .d-none { display: none; }
    </style>
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        
                        <div id="loginContainer">
                            <h3 class="text-center mb-4">Login</h3>
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" id="loginEmail" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Senha</label>
                                    <input type="password" id="loginPassword" class="form-control" required>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">Entrar</button>
                                </div>
                            </form>
                            <div class="text-center mt-3">
                                <small>Não tem conta? <a href="#" id="linkToSignup">Criar conta</a></small>
                            </div>
                        </div>

                        <div id="signupContainer" class="d-none">
                            <h3 class="text-center mb-4">Nova Conta</h3>
                            <form id="signupForm">
                                <div class="mb-3">
                                    <label class="form-label">Nome Completo</label>
                                    <input type="text" id="regName" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" id="regEmail" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Senha</label>
                                    <input type="password" id="regPassword" class="form-control" required>
                                    <div class="form-text">Mínimo 8 chars, maiúscula, minúscula, número e especial.</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Confirmar Senha</label>
                                    <input type="password" id="regConfirmPassword" class="form-control" required>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-success">Cadastrar</button>
                                </div>
                            </form>
                            <div class="text-center mt-3">
                                <small>Já tem conta? <a href="#" id="linkToLogin">Fazer Login</a></small>
                            </div>
                        </div>

                        <div id="feedbackMsg" class="alert mt-3 text-center d-none" role="alert"></div>

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
